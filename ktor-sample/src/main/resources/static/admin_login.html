<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WHODUNIT Admin — Login</title>
    <style>
        :root {
            --bg: #f6f8fa;
            --card: #ffffff;
            --accent: #0077cc;
            --muted: #666;
            --danger: #d9534f;
        }
        body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); margin:0; padding:20px; display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .card { width: 100%; max-width:420px; background:var(--card); padding:24px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.08); }
        h1 { margin:0 0 14px; font-size:20px; color:#222; }
        label { display:block; margin-top:10px; font-size:13px; color:var(--muted); }
        input[type="text"], input[type="password"], input[type="email"] {
            width:100%; padding:10px 12px; margin-top:6px; border:1px solid #ddd; border-radius:6px; font-size:14px; box-sizing:border-box;
        }
        .row { display:flex; gap:8px; align-items:center; }
        .small { font-size:13px; color:var(--muted); margin-top:6px; }
        .actions { margin-top:16px; display:flex; gap:8px; align-items:center; }
        button { padding:10px 14px; border-radius:8px; border:none; cursor:pointer; background:var(--accent); color:white; font-weight:600; }
        button[disabled] { opacity:0.6; cursor:not-allowed; }
        .secondary { background:#eee; color:#333; }
        .error { margin-top:8px; color:var(--danger); font-size:13px; }
        .inline { display:inline-block; vertical-align:middle; }
        .show-pass { background:transparent; border:none; color:var(--accent); cursor:pointer; font-size:13px; padding:6px; }
        .foot { margin-top:12px; font-size:13px; color:var(--muted); }
    </style>
</head>
<body>

<div class="card" role="main" aria-labelledby="loginTitle">
    <h1 id="loginTitle">Admin Login</h1>

    <form id="loginForm" autocomplete="on">
        <label for="username">Korisničko ime</label>
        <input id="username" name="username" type="text" required autocomplete="username" placeholder="detektiv.paris" />

        <label for="password">Lozinka</label>
        <div style="position:relative;">
            <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
            <button type="button" class="show-pass" id="togglePass" title="Prikaži lozinku" style="position:absolute; right:6px; top:8px;">Show</button>
        </div>

        <label class="row" style="margin-top:12px;">
            <input id="remember" name="remember" type="checkbox" style="margin-right:8px;" />
            <span class="small">Zapamti me</span>
        </label>

        <div class="actions">
            <button id="submitBtn" type="submit">Prijavi se</button>
            <button id="demoBtn" type="button" class="secondary" onclick="fillDemo()">Demo</button>
        </div>

        <div id="error" class="error" role="alert" aria-live="polite" style="display:none;"></div>

        <div class="foot">Ako nemaš nalog, kontaktiraj IT tim.</div>
    </form>
</div>

<script>

</script>

</body>
</html>
