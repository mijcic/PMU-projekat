<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>WHODUNIT Admin - Brisanje Priča</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style_admin.css">
    <link rel="stylesheet" href="/css/style_adminStory.css">
    <style>
        #jsonPreview {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 800px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            color: #222;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            #jsonPreview {
                max-height: 300px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<h1>WHODUNIT</h1>
<h2 class="subtitle">Admin - Brisanje priča (zločina)</h2>

<div class="white-box">
    <div class="table-container">
        <table id="zlocinTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Naziv</th>
                <th>Mesto</th>
                <th>Opis</th>
                <th>Datum</th>
                <th>Status</th>
                <th>Radnja</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="jsonPreview"><em>Ovde će se prikazati JSON podaci o pričama...</em></div>
</div>

<script>
    async function fetchStories() {
        try {
            const response = await fetch("http://localhost:8080/admin/getAll");
            if (!response.ok) throw new Error("Greška u komunikaciji sa serverom");

            const data = await response.json();
            renderTable(data);
            document.getElementById("jsonPreview").textContent = JSON.stringify(data, null, 4);
        } catch (err) {
            alert("❌ " + err.message);
        }
    }

    function renderTable(stories) {
        const tbody = document.querySelector("#zlocinTable tbody");
        tbody.innerHTML = "";

        stories.forEach((z) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${z.idZlocin}</td>
                <td>${z.naziv}</td>
                <td>${z.mesto}</td>
                <td>${z.opis}</td>
                <td>${new Date(z.datum).toLocaleDateString()}</td>
                <td>${z.status}</td>
                <td style="text-align:center;">
                    <button class="delete-btn" onclick="obrisi(${z.idZlocin})">Obriši</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function obrisi(id) {
        if (!confirm("Da li želite da obrišete priču ID: " + id + "?")) return;

        try {
            const response = await fetch(`http://localhost:8080/admin/delete/${id}`, { method: "DELETE" });
            if (response.ok) {
                alert("✅ Priča je uspešno obrisana.");
                fetchStories();
            } else {
                const errText = await response.text();
                alert("❌ Greška pri brisanju: " + errText);
            }
        } catch (err) {
            alert("❌ Greška u komunikaciji: " + err.message);
        }
    }

    fetchStories();
</script>

</body>
</html>
