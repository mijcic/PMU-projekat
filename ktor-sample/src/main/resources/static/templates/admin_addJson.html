<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>WHODUNIT Admin - Dodaj JSON</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        @font-face {
            font-family: 'Special Elite';
            src: url('/fonts/SpecialElite-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Special Elite', cursive;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('/img/background.jpg') no-repeat center center;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 20px;
        }

        h1 {
            color: white;
            margin: 10px 0 5px 0;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            text-align: center;
            font-size: 45px;
            line-height: 1.1;
        }

        h2.subtitle {
            color: white;
            font-size: 30px;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            text-align: center;
        }

        h3.subtitle {
            color: white;
            font-size: 25px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            text-align: center;
        }

        .white-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 25px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
            max-width: 700px;
            margin-bottom: 25px;
        }

        .button {
            padding: 10px 20px;
            background-color: #3E2F5B;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 8px;
            font-size: 16px;
            transition: background-color 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .button:hover {
            background-color: #2A213E;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }

        #jsonPreview {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 700px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            color: #222;
            margin-top: 20px;
        }
        #message {
            margin-top: 15px;
            color: green;
        }
        #error {
            margin-top: 15px;
            color: red;
        }

        input[type="file"] {
            color: white;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            padding: 6px;
            font-size: 16px;
        }

        input[type="file"]::file-selector-button {
            background-color: rgba(255, 255, 255, 0.9);
            color: black;
            border: none;
            border-radius: 5px;
            padding: 6px 12px;
            cursor: pointer;
            margin-right: 10px;
            transition: background-color 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }

        .story-type-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .story-button {
            background-color: transparent;
            border: none;
            font-size: 22px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            padding: 8px 15px;
            transition: color 0.3s;
        }

        .story-button:hover {
            color: #fff;
        }

        .story-button.active {
            color: #fff;
        }

        @media (max-width: 480px) {
            .white-box {
                width: 90%;
                padding: 20px;
            }

            .buttons-container {
                flex-direction: column;
                gap: 8px;
            }

            .story-type-buttons {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }

            .story-button {
                font-size: 18px;
                padding: 6px 12px;
            }

            .button {
                font-size: 14px;
                padding: 8px 15px;
                width: 100%;
                box-sizing: border-box;
            }

            #jsonPreview {
                max-width: 100%;
                max-height: 300px;
                padding: 15px;
            }

            input[type="file"] {
                width: 100%;
                box-sizing: border-box;
            }

            input[type="file"]::file-selector-button {
                width: auto;
                padding: 6px 12px;
            }
        }

    </style>
</head>
<body>

<h1>WHODUNIT</h1>
<h2 class="subtitle">Admin - Dodaj JSON priču</h2>

<div class="white-box">
    <div class="story-type-buttons">
        <button class="story-button active" id="btnUbistvo" onclick="setActive('ubistvo')">Ubistvo</button>
        <button class="story-button" id="btnMS" onclick="setActive('MS')">Misteriozni simptomi</button>
    </div>

    <input type="file" id="jsonFileInput" accept=".json" />

    <div class="buttons-container">
        <button class="button" onclick="previewJson()">Pregled JSON-a</button>
        <button class="button" onclick="submitJson()">Sačuvaj u bazu</button>
    </div>

    <div id="jsonPreview"><em>Ovde će se prikazati sadržaj JSON fajla za ubistvo...</em></div>
    <div id="message"></div>
    <div id="error"></div>
</div>

<script>
    let jsonData = null;
    let currentStoryType = 'ubistvo';

    function setActive(type) {
        currentStoryType = type;

        const btnUbistvo = document.getElementById('btnUbistvo');
        const btnMS = document.getElementById('btnMS');
        const preview = document.getElementById('jsonPreview');
        const errorDiv = document.getElementById('error');
        const messageDiv = document.getElementById('message');

        if (type == 'ubistvo') {
            btnUbistvo.classList.add('active');
            btnMS.classList.remove('active');
            preview.innerHTML = "<em>Ovde će se prikazati sadržaj JSON fajla za ubistvo...</em>";
            errorDiv.innerHTML="";
            messageDiv.innerHTML="";
        } else if (type == 'MS') {
            btnUbistvo.classList.remove('active');
            btnMS.classList.add('active');
            preview.innerHTML = "<em>Ovde će se prikazati sadržaj JSON fajla za misteriozne simptome...</em>";
            errorDiv.innerHTML="";
            messageDiv.innerHTML="";
        }
    }

    function previewJson() {
        const input = document.getElementById('jsonFileInput');
        const preview = document.getElementById('jsonPreview');
        const errorDiv = document.getElementById('error');
        const messageDiv = document.getElementById('message');

        messageDiv.textContent = "";
        errorDiv.textContent = "";

        if (!input.files || input.files.length === 0) {
            errorDiv.textContent = "Molimo izaberite JSON fajl.";
            return;
        }

        const file = input.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            try {
                jsonData = JSON.parse(e.target.result);
                preview.textContent = JSON.stringify(jsonData, null, 4);
            } catch(err) {
                jsonData = null;
                if (currentStoryType == 'ubistvo') {
                    preview.textContent = "Ovde će se prikazati sadržaj JSON fajla za ubistvo...";
                }
                else {
                    preview.textContent = "Ovde će se prikazati sadržaj JSON fajla za misteriozne simptome...";
                }
                errorDiv.textContent = "Greška: fajl nije validan JSON.";
            }
        };

        reader.readAsText(file);
    }

    async function submitJson() {
        const errorDiv = document.getElementById('error');
        const messageDiv = document.getElementById('message');

        messageDiv.textContent = "";
        errorDiv.textContent = "";

        if (!jsonData) {
            errorDiv.textContent = "Nema JSON-a za slanje. Molimo prvo pregledajte fajl.";
            return;
        }

        try {
            const response = await fetch('/admin/addJson', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonData)
            });

            if (response.ok) {
                messageDiv.textContent = "Uspesno";
            } else {
                const data = await response.json();
                errorDiv.textContent = "Greška pri čuvanju: " + (data.error || response.statusText);
            }
        } catch (err) {
            errorDiv.textContent = "Greška u komunikaciji: " + err.message;
        }
    }
</script>

</body>
</html>
