<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>WHODUNIT Admin - Statistika</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @font-face {
            font-family: 'Special Elite';
            src: url('/fonts/SpecialElite-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Special Elite', cursive;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('/img/background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        h1 {
            color: white;
            font-size: 45px;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
        }

        h2.subtitle {
            color: white;
            font-size: 30px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            text-align: center;
        }

        .white-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 25px 40px;
            width: 95%;
            max-width: 800px;
            text-align: center;
            color: white;
        }

        .stats-box p {
            font-size: 20px;
            margin: 10px 0;
        }

        canvas {
            max-width: 600px;
            width: 100%;
            max-height: 280px;
            margin: 25px auto 10px auto;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            padding: 10px;
        }

        @media (max-width: 480px) {
            .white-box {
                width: 90%;
                padding: 20px;
            }

            h1 {
                font-size: 35px;
            }

            h2.subtitle {
                font-size: 24px;
            }

            .stats-box p {
                font-size: 18px;
            }

            canvas {
                padding: 8px;
                max-height: 220px;
            }
        }
    </style>
</head>
<body>

<h1>WHODUNIT</h1>
<h2 class="subtitle">📊 Statistika zločina</h2>

<div class="white-box stats-box" id="statsBox">
    <p><b>Ukupno zločina:</b> <span id="ukupnoZlocina">...</span></p>
    <p><b>U istrazi:</b> <span id="uIstr">...</span></p>
    <p><b>Rešenih slučajeva:</b> <span id="zatvoreni">...</span></p>
</div>

<canvas id="chartStatus"></canvas>

<script>
    async function fetchStats() {
        try {
            const response = await fetch("http://localhost:8080/admin/stats");
            if (!response.ok) throw new Error("Greška u komunikaciji sa serverom");

            const stats = await response.json();

            document.getElementById("ukupnoZlocina").textContent = stats.ukupnoZlocina;
            document.getElementById("uIstr").textContent = stats.uIstr;
            document.getElementById("zatvoreni").textContent = stats.zatvoreni;

            const ctx = document.getElementById("chartStatus").getContext("2d");
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['U istrazi', 'Rešeni'],
                    datasets: [{
                        label: 'Status slučajeva',
                        data: [stats.uIstr, stats.zatvoreni],
                        backgroundColor: ['#0077cc', '#28a745']
                    }]
                },
                options: {
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#222' } },
                        title: {
                            display: true,
                            text: 'Raspodela slučajeva po statusu',
                            color: '#222',
                            font: { size: 18 }
                        }
                    },
                    maintainAspectRatio: false
                }
            });
        } catch (err) {
            alert("❌ " + err.message);
        }
    }

    fetchStats();
</script>

</body>
</html>
