<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>WHODUNIT Admin - Statistika</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/style_admin.css">
    <style>
        .white-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 25px 40px;
            width: 95%;
            max-width: 800px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

<h1>WHODUNIT</h1>
<h2 class="subtitle">📊 Statistika zločina</h2>

<div class="white-box stats-box" id="statsBox">
    <p><b>Ukupno zločina:</b> <span id="ukupnoZlocina">...</span></p>
    <p><b>U istrazi:</b> <span id="uIstr">...</span></p>
    <p><b>Rešenih slučajeva:</b> <span id="zatvoreni">...</span></p>
</div>

<canvas id="chartStatus"></canvas>

<script>
    async function fetchStats() {
        try {
            const response = await fetch("http://localhost:8080/admin/stats");
            if (!response.ok) throw new Error("Greška u komunikaciji sa serverom");

            const stats = await response.json();

            document.getElementById("ukupnoZlocina").textContent = stats.ukupnoZlocina;
            document.getElementById("uIstr").textContent = stats.uIstr;
            document.getElementById("zatvoreni").textContent = stats.zatvoreni;

            const ctx = document.getElementById("chartStatus").getContext("2d");
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['U istrazi', 'Rešeni'],
                    datasets: [{
                        label: 'Status slučajeva',
                        data: [stats.uIstr, stats.zatvoreni],
                        backgroundColor: ['#0077cc', '#28a745']
                    }]
                },
                options: {
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#222' } },
                        title: {
                            display: true,
                            text: 'Raspodela slučajeva po statusu',
                            color: '#222',
                            font: { size: 18 }
                        }
                    },
                    maintainAspectRatio: false
                }
            });
        } catch (err) {
            alert("❌ " + err.message);
        }
    }

    fetchStats();
</script>

</body>
</html>
