<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>WHODUNIT Admin - Pregled Priča</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style_admin.css">
    <link rel="stylesheet" href="/css/style_adminStory.css">
</head>
<body>

<h1>WHODUNIT</h1>
<h2 class="subtitle">Admin - Pregled svih priča (zločina)</h2>

<div class="white-box">
    <div class="table-container">
        <table id="zlocinTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Naziv</th>
                <th>Mesto</th>
                <th>Opis</th>
                <th>Datum</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <div id="jsonPreview"><em>Ovde će se prikazati JSON podaci o pričama...</em></div>
</div>

<script>
    async function fetchStories() {
        try {
            const response = await fetch("http://localhost:8080/admin/getAll");
            if (!response.ok) throw new Error("Greška u komunikaciji sa serverom");

            const data = await response.json();
            renderTable(data);
            document.getElementById("jsonPreview").textContent = JSON.stringify(data, null, 4);
        } catch (err) {
            alert("❌ " + err.message);
        }
    }

    function renderTable(stories) {
        const tbody = document.querySelector("#zlocinTable tbody");
        tbody.innerHTML = "";

        stories.forEach((z) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${z.idZlocin}</td>
                <td>${z.naziv}</td>
                <td>${z.mesto}</td>
                <td>${z.opis}</td>
                <td>${new Date(z.datum).toLocaleDateString()}</td>
                <td>${z.status}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    fetchStories();
</script>

</body>
</html>
