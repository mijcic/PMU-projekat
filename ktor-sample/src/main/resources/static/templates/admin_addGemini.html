<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>WHODUNIT Admin - Ručni Unos Ubistvo</title>
    <link rel="stylesheet" href="/css/style_admin.css">
    <style>
        h1, h2, h3 {
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            font-size: 45px;
            margin: 10px 0 5px 0;
            line-height: 1.1;
        }

        h2.subtitle {
            color: white;
            font-size: 30px;
            margin-bottom: 20px;
            margin-top: 5px;
        }

        .entity-box {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 12px;
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .entity-box h2 {
            margin-top: 5px;
            margin-bottom: 15px;
            text-align: center;
            color: white;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        label {
            width: 100%;
            margin-bottom: 10px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        input, textarea, select {
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.5);
            font-size: 16px;
            background-color: rgba(255,255,255,0.9);
            text-align: center;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            background-color: #3E2F5B;
            color: white;
            font-size: 16px;
            transition: background-color 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            margin-top: 10px;
        }

        button:hover {
            background-color: #2A213E;
        }

        #jsonPreview {
            background: white;
            border-radius: 8px;
            padding: 20px;
            max-width: 700px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            color: #222;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 100%;
        }

        @media (max-width: 480px) {
            .entity-box {
                width: 90%;
                padding: 20px;
            }
            input, textarea, select {
                font-size: 14px;
                width: 95%;
                padding: 6px;
            }
            button {
                width: 100%;
                font-size: 14px;
                padding: 8px 0;
            }
            #jsonPreview {
                max-height: 300px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<h1>WHODUNIT</h1>
<h2 class="subtitle">Ubistvo - Ručni unos</h2>

<div class="entity-box">
    <h2>1️⃣ Ubistvo (zlocinR)</h2>
    <form id="zlocinForm">
        <label>Naziv: <input type="text" name="naziv" /></label>
        <label>Datum: <input type="date" name="datum" /></label>
        <label>Mesto: <input type="text" name="mesto" /></label>
        <label>Opis: <textarea name="opis"></textarea></label>
        <label>Status:
            <select name="status">
                <option value="u_istrazi">U istrazi</option>
                <option value="resen">Rešen</option>
            </select>
        </label>
        <button type="button" onclick="addZlocin()" style="margin-bottom: 20px">Dodaj Ubistvo</button>
    </form>
    <h2>2️⃣ Žrtva (zrtvaR)</h2>
    <form id="zrtvaForm">
        <label>Tip žrtve: <input type="text" name="tipZrtve" /></label>
        <label>Detalji: <textarea name="detalji"></textarea></label>
        <label>Status: <input type="text" name="statusZrtva" /></label>
        <label>Ime: <input type="text" name="ime" /></label>
        <label>Kontakt: <input type="text" name="kontakt" /></label>
        <label>Datum rođenja: <input type="date" name="datumOsoba" /></label>
        <label>Zanimanje: <input type="text" name="zanimanje" /></label>
        <label>Pol:
            <select name="pol">
                <option value="muski">muški</option>
                <option value="zenski">ženski</option>
            </select>
        </label>
        <button type="button" onclick="addZrtva()">Dodaj Žrtvu</button>
    </form>
    <button onclick="popuniAutomatski()">🤖 Popuni automatski (Gemini)</button>
</div>

<div class="entity-box">
    <h2>3️⃣ Osumnjičeni (osumnjicenR)</h2>
    <form id="osumnjicenForm">
        <label>Tip osumnjičenog: <input type="text" name="tipOsumnjicen" /></label>
        <label>Kriv? <input type="number" name="kriv" /></label>
        <label>Motiv: <input type="text" name="motivOpis" /></label>
        <label>Ime osobe: <input type="text" name="imeOsumnjicen" /></label>
        <label>Kontakt osobe: <input type="text" name="kontaktOsumnjicen" /></label>
        <label>Datum rođenja: <input type="date" name="datumOsumnjicen" /></label>
        <label>Zanimanje: <input type="text" name="zanimanjeOsumnjicen" /></label>
        <label>Pol: <input type="text" name="polOsumnjicen" /></label>
        <button type="button" onclick="addOsumnjicen()">Dodaj Osumnjičenog</button>
    </form>
</div>

<div class="entity-box">
    <h2>4️⃣ Dokazi (dokazR)</h2>
    <form id="dokazForm">
        <label>Tip dokaza: <input type="text" name="tipDokaza" /></label>
        <label>Opis: <textarea name="opis"></textarea></label>
        <label>Status: <input type="number" name="status" /></label>
        <button type="button" onclick="addDokaz()">Dodaj dokaz</button>
    </form>
</div>

<div class="entity-box">
    <h2>5️⃣ Svedoci (svedokR)</h2>
    <form id="svedokForm">
        <label>Ime: <input type="text" name="ime" /></label>
        <label>Kontakt: <input type="text" name="kontakt" /></label>
        <label>Datum rođenja: <input type="date" name="datum" /></label>
        <label>Zanimanje: <input type="text" name="zanimanje" /></label>
        <label>Pol: <input type="text" name="pol" /></label>
        <label>Izjava: <textarea name="izjava"></textarea></label>
        <button type="button" onclick="addSvedok()">Dodaj svedoka</button>
    </form>
</div>

<button onclick="generateJsonFile()">Generiši JSON fajl</button>

<h3>📄 Trenutni JSON:</h3>
<div id="jsonPreview">{}</div>

<script>
    let geminiData = { zlocinR: null, zrtvaR: null, osumnjicenR: [], dokazR: [], svedokR: [] };

    function updatePreview() {
        document.getElementById("jsonPreview").textContent = JSON.stringify(geminiData, null, 4);
    }

    function addZlocin() {
        const f = document.getElementById("zlocinForm");
        geminiData.zlocinR = {
            idZlocin: Date.now(),
            tipZlocinaId: 1,
            naziv: f.naziv.value,
            datum: f.datum.value,
            mesto: f.mesto.value,
            opis: f.opis.value,
            status: f.status.value
        };
        updatePreview();
        alert("Ubistvo dodato!");
    }

    function addZrtva() {
        const f = document.getElementById("zrtvaForm");
        geminiData.zrtvaR = {
            idZrtva: Date.now(),
            tipZrtve: f.tipZrtve.value,
            detalji: f.detalji.value,
            statusZrtva: f.statusZrtva.value,
            zlocinId: geminiData.zlocinR?.idZlocin || 0,
            osobaId: {
                idOsoba: Date.now(),
                ime: f.ime.value,
                kontakt: f.kontakt.value,
                datum: f.datumOsoba.value,
                zanimanje: f.zanimanje.value,
                pol: f.pol.value,
                zlocinId: geminiData.zlocinR?.idZlocin || 0
            }
        };
        updatePreview();
        alert("Žrtva dodata!");
    }

    function addOsumnjicen() {
        const f = document.getElementById("osumnjicenForm");
        geminiData.osumnjicenR.push({
            idOsumnjicen: Date.now(),
            status: 0,
            tipOsumnjicen: f.tipOsumnjicen.value,
            motiv: { idMotiv: Date.now(), opis: f.motivOpis.value },
            zlocinId: geminiData.zlocinR?.idZlocin || 0,
            kriv: parseInt(f.kriv.value),
            osobaId: {
                idOsoba: Date.now(),
                ime: f.imeOsumnjicen.value,
                kontakt: f.kontaktOsumnjicen.value,
                datum: f.datumOsumnjicen.value,
                zanimanje: f.zanimanjeOsumnjicen.value,
                pol: f.polOsumnjicen.value,
                zlocinId: geminiData.zlocinR?.idZlocin || 0
            }
        });
        updatePreview();
        alert("Osumnjičeni dodat!");
    }

    function addDokaz() {
        const f = document.getElementById("dokazForm");
        geminiData.dokazR.push({
            idDokaz: Date.now(),
            tipDokaza: f.tipDokaza.value,
            opis: f.opis.value,
            zlocinId: geminiData.zlocinR?.idZlocin || 0,
            zrtvaId: geminiData.zrtvaR?.idZrtva || 0,
            status: parseInt(f.status.value)
        });
        updatePreview();
        alert("Dokaz dodat!");
    }

    function addSvedok() {
        const f = document.getElementById("svedokForm");
        geminiData.svedokR.push({
            idSvedok: Date.now(),
            izjava: f.izjava.value,
            statusSvedok: "aktivno",
            statusIspitan: 0,
            zlocinId: geminiData.zlocinR?.idZlocin || 0,
            osobaId: {
                idOsoba: Date.now(),
                ime: f.ime.value,
                kontakt: f.kontakt.value,
                datum: f.datum.value,
                zanimanje: f.zanimanje.value,
                pol: f.pol.value,
                zlocinId: geminiData.zlocinR?.idZlocin || 0
            }
        });
        updatePreview();
        alert("Svedok dodat!");
    }

    function generateJsonFile() {
        const dataStr = JSON.stringify(geminiData, null, 4);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "whodunit_story.json";
        a.click();
        URL.revokeObjectURL(url);
        alert("JSON fajl generisan!");
    }

    async function popuniAutomatski() {
        try {
            const res = await fetch("http://localhost:8080/admin/gemini", { method: "POST" });
            if (!res.ok) throw new Error("Greška pri pozivu Gemini-a");
            const data = await res.json();

            geminiData.zlocinR = data.zlocinR;
            geminiData.zrtvaR = data.zrtvaR;

            // Popuni formu za zločin
            const zForm = document.getElementById("zlocinForm");
            zForm.naziv.value = data.zlocinR.naziv;
            zForm.datum.value = data.zlocinR.datum;
            zForm.mesto.value = data.zlocinR.mesto;
            zForm.opis.value = data.zlocinR.opis;
            zForm.status.value = data.zlocinR.status;

            // Popuni formu za žrtvu
            const zrtvaForm = document.getElementById("zrtvaForm");
            const osoba = data.zrtvaR.osobaId;
            zrtvaForm.tipZrtve.value = data.zrtvaR.tipZrtve;
            zrtvaForm.detalji.value = data.zrtvaR.detalji;
            zrtvaForm.statusZrtva.value = data.zrtvaR.statusZrtva;
            zrtvaForm.ime.value = osoba.ime;
            zrtvaForm.kontakt.value = osoba.kontakt;
            zrtvaForm.datumOsoba.value = osoba.datum;
            zrtvaForm.zanimanje.value = osoba.zanimanje;
            zrtvaForm.pol.value = osoba.pol;

            updatePreview();
            alert("✅ Podaci popunjeni automatski!");
        } catch (err) {
            alert("❌ " + err.message);
        }
    }
</script>

</body>
</html>
