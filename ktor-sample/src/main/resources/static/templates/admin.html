<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8" />
    <title>WHODUNIT Admin Panel</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        @font-face {
            font-family: 'Special Elite';
            src: url('/fonts/SpecialElite-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Special Elite', cursive;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('/img/background.jpg') no-repeat center center;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 20px;
        }

        h1 {
            color: white;
            margin: 10px 0 5px 0;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            text-align: center;
            font-size: 45px;
            line-height: 1.1;
        }

        h2.subtitle {
            color: white;
            font-size: 30px;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            text-align: center;
        }

        .white-box.info-box {
            padding: 18px 25px 10px 25px;
            display: inline-block;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-top: 2px;
            margin-bottom: 25px;
            text-align: left;
        }

        .white-box.info-box a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s ease;
            line-height: 1.1;
            margin: 0;
            padding: 2px 0;
        }

        .white-box.info-box a:hover {
            color: #A99367;
        }

        .white-box.info-box {
            display: inline-block;
            padding: 15px 25px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-top: 10px;
            margin-bottom: 20px;
            text-align: left;
        }

        .white-box.info-box ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .white-box.info-box li {
            position: relative;
            padding-left: 20px;
            margin: 3px 0;
        }

        .white-box.info-box li::before {
            content: "■";
            position: absolute;
            left: 0;
            color: #fff;
            font-size: 16px;
            line-height: 1;
        }

        .white-box.info-box a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }

        .white-box.info-box a:hover {
            color: #ffdf91;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
                justify-content: flex-start;
            }

            h1 {
                font-size: 32px;
                margin-top: 15px;
            }

            h2.subtitle {
                font-size: 22px;
                margin-bottom: 15px;
            }

            .white-box.info-box {
                width: 100%;
                padding: 12px 18px;
                margin-bottom: 15px;
            }

            .white-box.info-box a {
                font-size: 15px;
                line-height: 1.3;
                word-break: break-word;
            }

            .white-box.info-box li::before {
                font-size: 14px;
                top: 2px;
            }
        }

    </style>
</head>
<body>

<h1>WHODUNIT</h1>
<h2 class="subtitle">Admin Panel</h2>

<div class="white-box info-box">
    <ul>
        <li><a href="admin_addJson.html">Idi na admin_addJson stranicu</a></li>
        <li><a href="admin_addFormsMurder.html">Idi na admin_addFormsMurder stranicu</a></li>
        <li><a href="admin_addGemini.html">Idi na admin_addGemini stranicu</a></li>
        <li><a href="admin_korisnici.html">Idi na admin_korisnici stranicu</a></li>
        <li><a href="admin_story.html">Idi na admin_story stranicu</a></li>
        <li><a href="admin_delete.html">Idi na admin_delete stranicu</a></li>
        <li><a href="admin_stats.html">Idi na admin_stats stranicu</a></li>
        <li><a href="admin_login.html">Idi na admin_login stranicu</a></li>
    </ul>
</div>

</body>
</html>
